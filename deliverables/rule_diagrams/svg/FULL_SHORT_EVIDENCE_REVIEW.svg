<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Έλεγχος αρχικής κάρτας και ιστορικής σύμβασης" viewBox="0 0 780 497"><style>text{font:15px system-ui,sans-serif;fill:#172a3a} .box{fill:#f4f7fa;stroke:#7b8b98;stroke-width:1.5}.question{fill:#fff6db;stroke:#b48c25;stroke-width:1.5}.yes{fill:#eaf7f0;stroke:#258259;stroke-width:1.5}.no{fill:#edf2f8;stroke:#73879b;stroke-width:1.5}.line{fill:none;stroke:#536a7d;stroke-width:1.5}</style><defs><marker id="arrow-FULL_SHORT_EVIDENCE_REVIEW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a7d"/></marker></defs><rect class="box" x="55" y="6" width="670" height="45" rx="10"/><text text-anchor="middle"><tspan x="390" y="30">Έφτασε εδώ η ροή, χωρίς προγενέστερο ταίριασμα</tspan></text><path class="line" marker-end="url(#arrow-FULL_SHORT_EVIDENCE_REVIEW)" d="M390 51 V87"/><polygon class="question" points="390,87 758,184.5 390,282 22,184.5"/><text text-anchor="middle"><tspan x="390" y="147.5">Δεν υπάρχει αποθηκευμένη έναρξη ισχύος</tspan><tspan x="390" y="168.5">σύμβασης έως την ημέρα εργασίας, έχει</tspan><tspan x="390" y="189.5">παρέλθει τυχόν λήξη, ή δεν επαληθεύεται</tspan><tspan x="390" y="210.5">μοναδικό αρχικό πλήρες ζεύγος με ίδια όρια</tspan><tspan x="390" y="231.5">και καθαρή διάρκεια ≥ βάση.</tspan></text><path class="line" marker-end="url(#arrow-FULL_SHORT_EVIDENCE_REVIEW)" d="M390 282 V306 H195 V342"/><path class="line" marker-end="url(#arrow-FULL_SHORT_EVIDENCE_REVIEW)" d="M390 306 H585 V342"/><text text-anchor="middle"><tspan x="260" y="301">ΝΑΙ</tspan></text><text text-anchor="middle"><tspan x="520" y="301">ΟΧΙ</tspan></text><rect class="yes" x="15" y="342" width="355" height="137" rx="8"/><rect class="no" x="410" y="342" width="355" height="137" rx="8"/><text text-anchor="middle"><tspan x="192.5" y="368">Ε: Έλεγχος χωρίς αυτόματη</tspan><tspan x="192.5" y="389">επέκταση. Η πρόταση του</tspan><tspan x="192.5" y="410">προγενέστερου γενικού κανόνα</tspan><tspan x="192.5" y="431">εμφανίζεται μόνο ως αναφορά, όχι</tspan><tspan x="192.5" y="452">ως εγκεκριμένο ωράριο.</tspan></text><text text-anchor="middle"><tspan x="587.5" y="368">Συνέχεια στον επόμενο έλεγχο.</tspan></text></svg>