<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Μηνιαία ωρομέτρηση" viewBox="0 0 780 418"><style>text{font:15px system-ui,sans-serif;fill:#172a3a} .box{fill:#f4f7fa;stroke:#7b8b98;stroke-width:1.5}.question{fill:#fff6db;stroke:#b48c25;stroke-width:1.5}.yes{fill:#eaf7f0;stroke:#258259;stroke-width:1.5}.no{fill:#edf2f8;stroke:#73879b;stroke-width:1.5}.line{fill:none;stroke:#536a7d;stroke-width:1.5}</style><defs><marker id="arrow-W-MONTH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a7d"/></marker></defs><rect class="box" x="55" y="6" width="670" height="45" rx="10"/><text text-anchor="middle"><tspan x="390" y="30">Είσοδος στη συγκεκριμένη διαδρομή</tspan></text><path class="line" marker-end="url(#arrow-W-MONTH)" d="M390 51 V87"/><polygon class="question" points="390,87 758,155.5 390,224 22,155.5"/><text text-anchor="middle"><tspan x="390" y="139.5">Υπάρχουν ολοκληρωμένες εβδομάδες με</tspan><tspan x="390" y="160.5">αποθηκευμένο report και χωρίς Ε μετά την</tspan><tspan x="390" y="181.5">εξαίρεση αδειών;</tspan></text><path class="line" marker-end="url(#arrow-W-MONTH)" d="M390 224 V248 H195 V284"/><path class="line" marker-end="url(#arrow-W-MONTH)" d="M390 248 H585 V284"/><text text-anchor="middle"><tspan x="260" y="243">ΝΑΙ</tspan></text><text text-anchor="middle"><tspan x="520" y="243">ΟΧΙ</tspan></text><rect class="yes" x="15" y="284" width="355" height="116" rx="8"/><rect class="no" x="410" y="284" width="355" height="116" rx="8"/><text text-anchor="middle"><tspan x="192.5" y="310">Υπολογισμός ολόκληρων εβδομάδων</tspan><tspan x="192.5" y="331">χρονολογικά, μεταφορά ετήσιου</tspan><tspan x="192.5" y="352">υπολοίπου, τελική επιλογή ημερών</tspan><tspan x="192.5" y="373">μέσα στον μήνα.</tspan></text><text text-anchor="middle"><tspan x="587.5" y="310">Σφάλμα έλλειψης</tspan><tspan x="587.5" y="331">snapshot/εβδομάδων ή λίστα</tspan><tspan x="587.5" y="352">εβδομάδων με Ε.</tspan></text></svg>