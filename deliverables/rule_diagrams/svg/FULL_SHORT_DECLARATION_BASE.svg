<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Πλήρης βάση αντί μικρής δήλωσης" viewBox="0 0 780 455"><style>text{font:15px system-ui,sans-serif;fill:#172a3a} .box{fill:#f4f7fa;stroke:#7b8b98;stroke-width:1.5}.question{fill:#fff6db;stroke:#b48c25;stroke-width:1.5}.yes{fill:#eaf7f0;stroke:#258259;stroke-width:1.5}.no{fill:#edf2f8;stroke:#73879b;stroke-width:1.5}.line{fill:none;stroke:#536a7d;stroke-width:1.5}</style><defs><marker id="arrow-FULL_SHORT_DECLARATION_BASE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a7d"/></marker></defs><rect class="box" x="55" y="6" width="670" height="45" rx="10"/><text text-anchor="middle"><tspan x="390" y="30">Έφτασε εδώ η ροή, χωρίς προγενέστερο ταίριασμα</tspan></text><path class="line" marker-end="url(#arrow-FULL_SHORT_DECLARATION_BASE)" d="M390 51 V87"/><polygon class="question" points="390,87 758,184.5 390,282 22,184.5"/><text text-anchor="middle"><tspan x="390" y="147.5">Πλήρης εργασία, συμβατική βάση = ημερήσια</tspan><tspan x="390" y="168.5">βάση, 0 &lt; δηλωμένα &lt; βάση ≤ καθαρά</tspan><tspan x="390" y="189.5">πραγματικά, και μοναδικό αρχικό πλήρες ζεύγος</tspan><tspan x="390" y="210.5">με ίδια όρια/καθαρή διάρκεια ≥ βάση και</tspan><tspan x="390" y="231.5">ιστορική σύμβαση που καλύπτει την ημέρα;</tspan></text><path class="line" marker-end="url(#arrow-FULL_SHORT_DECLARATION_BASE)" d="M390 282 V306 H195 V342"/><path class="line" marker-end="url(#arrow-FULL_SHORT_DECLARATION_BASE)" d="M390 306 H585 V342"/><text text-anchor="middle"><tspan x="260" y="301">ΝΑΙ</tspan></text><text text-anchor="middle"><tspan x="520" y="301">ΟΧΙ</tspan></text><rect class="yes" x="15" y="342" width="355" height="95" rx="8"/><rect class="no" x="410" y="342" width="355" height="95" rx="8"/><text text-anchor="middle"><tspan x="192.5" y="368">Μ · Πραγματική είσοδος +</tspan><tspan x="192.5" y="389">συμβατική βάση, χωρίς προσθήκη</tspan><tspan x="192.5" y="410">διαλείμματος.</tspan></text><text text-anchor="middle"><tspan x="587.5" y="368">Συνέχεια στον επόμενο έλεγχο.</tspan></text></svg>