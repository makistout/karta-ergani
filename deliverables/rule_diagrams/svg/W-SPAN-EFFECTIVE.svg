<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Χρήση effective διαστήματος" viewBox="0 0 780 409"><style>text{font:15px system-ui,sans-serif;fill:#172a3a} .box{fill:#f4f7fa;stroke:#7b8b98;stroke-width:1.5}.question{fill:#fff6db;stroke:#b48c25;stroke-width:1.5}.yes{fill:#eaf7f0;stroke:#258259;stroke-width:1.5}.no{fill:#edf2f8;stroke:#73879b;stroke-width:1.5}.line{fill:none;stroke:#536a7d;stroke-width:1.5}</style><defs><marker id="arrow-W-SPAN-EFFECTIVE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a7d"/></marker></defs><rect class="box" x="55" y="6" width="670" height="45" rx="10"/><text text-anchor="middle"><tspan x="390" y="30">Ολοκληρωμένο απολογιστικό / αντίστοιχη διαδρομή</tspan></text><path class="line" marker-end="url(#arrow-W-SPAN-EFFECTIVE)" d="M390 51 V87"/><polygon class="question" points="390,87 758,151.0 390,215 22,151.0"/><text text-anchor="middle"><tspan x="390" y="145.5">Μη εργασία, όχι ακριβώς ένα δηλωμένο και ένα</tspan><tspan x="390" y="166.5">πραγματικό, σπαστό ή Τεκμαρτό;</tspan></text><path class="line" marker-end="url(#arrow-W-SPAN-EFFECTIVE)" d="M390 215 V239 H195 V275"/><path class="line" marker-end="url(#arrow-W-SPAN-EFFECTIVE)" d="M390 239 H585 V275"/><text text-anchor="middle"><tspan x="260" y="234">ΝΑΙ</tspan></text><text text-anchor="middle"><tspan x="520" y="234">ΟΧΙ</tspan></text><rect class="yes" x="15" y="275" width="355" height="116" rx="8"/><rect class="no" x="410" y="275" width="355" height="116" rx="8"/><text text-anchor="middle"><tspan x="192.5" y="301">Διαστήματα της effective</tspan><tspan x="192.5" y="322">ετικέτας. Αν υπάρχει εξωτερικό</tspan><tspan x="192.5" y="343">διάλειμμα, επέκταση λήξης του</tspan><tspan x="192.5" y="364">τελευταίου διαστήματος.</tspan></text><text text-anchor="middle"><tspan x="587.5" y="301">Χρονική τοποθέτηση από ένα</tspan><tspan x="587.5" y="322">δηλωμένο και ένα πραγματικό</tspan><tspan x="587.5" y="343">διάστημα.</tspan></text></svg>