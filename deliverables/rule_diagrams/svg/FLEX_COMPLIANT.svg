<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Αποδεκτή ευελιξία" viewBox="0 0 780 397"><style>text{font:15px system-ui,sans-serif;fill:#172a3a} .box{fill:#f4f7fa;stroke:#7b8b98;stroke-width:1.5}.question{fill:#fff6db;stroke:#b48c25;stroke-width:1.5}.yes{fill:#eaf7f0;stroke:#258259;stroke-width:1.5}.no{fill:#edf2f8;stroke:#73879b;stroke-width:1.5}.line{fill:none;stroke:#536a7d;stroke-width:1.5}</style><defs><marker id="arrow-FLEX_COMPLIANT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a7d"/></marker></defs><rect class="box" x="55" y="6" width="670" height="45" rx="10"/><text text-anchor="middle"><tspan x="390" y="30">Έφτασε εδώ η ροή, χωρίς προγενέστερο ταίριασμα</tspan></text><path class="line" marker-end="url(#arrow-FLEX_COMPLIANT)" d="M390 51 V87"/><polygon class="question" points="390,87 758,155.5 390,224 22,155.5"/><text text-anchor="middle"><tspan x="390" y="139.5">Είσοδος μέσα στο [δηλωμένη έναρξη, +flex] Ή</tspan><tspan x="390" y="160.5">είσοδος μετά το παράθυρο και έξοδος ≤</tspan><tspan x="390" y="181.5">δηλωμένη λήξη + flex;</tspan></text><path class="line" marker-end="url(#arrow-FLEX_COMPLIANT)" d="M390 224 V248 H195 V284"/><path class="line" marker-end="url(#arrow-FLEX_COMPLIANT)" d="M390 248 H585 V284"/><text text-anchor="middle"><tspan x="260" y="243">ΝΑΙ</tspan></text><text text-anchor="middle"><tspan x="520" y="243">ΟΧΙ</tspan></text><rect class="yes" x="15" y="284" width="355" height="95" rx="8"/><rect class="no" x="410" y="284" width="355" height="95" rx="8"/><text text-anchor="middle"><tspan x="192.5" y="310">Σ · Διατήρηση δηλωμένου. Αν</tspan><tspan x="192.5" y="331">υπάρχουν λεπτά υπερωρίας,</tspan><tspan x="192.5" y="352">ακολουθεί OVERTIME_ONLY.</tspan></text><text text-anchor="middle"><tspan x="587.5" y="310">Συνέχεια στον επόμενο έλεγχο.</tspan></text></svg>