<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Σύμφωνο μετά μεταφορά νυχτερινών" viewBox="0 0 780 384"><style>text{font:15px system-ui,sans-serif;fill:#172a3a} .box{fill:#f4f7fa;stroke:#7b8b98;stroke-width:1.5}.question{fill:#fff6db;stroke:#b48c25;stroke-width:1.5}.yes{fill:#eaf7f0;stroke:#258259;stroke-width:1.5}.no{fill:#edf2f8;stroke:#73879b;stroke-width:1.5}.line{fill:none;stroke:#536a7d;stroke-width:1.5}</style><defs><marker id="arrow-POST_CARRY_COMPLIANT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a7d"/></marker></defs><rect class="box" x="55" y="6" width="670" height="45" rx="10"/><text text-anchor="middle"><tspan x="390" y="30">Ειδική διαδρομή / έλεγχος μετά την κύρια απόφαση</tspan></text><path class="line" marker-end="url(#arrow-POST_CARRY_COMPLIANT)" d="M390 51 V87"/><polygon class="question" points="390,87 758,170.0 390,253 22,170.0"/><text text-anchor="middle"><tspan x="390" y="143.5">Μεταφέρθηκαν χτυπήματα στη χθεσινή βάρδια,</tspan><tspan x="390" y="164.5">υπάρχει ένα δηλωμένο τμήμα, έγκυρη έναρξη,</tspan><tspan x="390" y="185.5">δηλωμένα λεπτά και όχι πιθανό σπαστό, ΚΑΙ</tspan><tspan x="390" y="206.5">έναρξη + δηλωμένη διάρκεια = δηλωμένο;</tspan></text><path class="line" marker-end="url(#arrow-POST_CARRY_COMPLIANT)" d="M390 253 V277 H195 V313"/><path class="line" marker-end="url(#arrow-POST_CARRY_COMPLIANT)" d="M390 277 H585 V313"/><text text-anchor="middle"><tspan x="260" y="272">ΝΑΙ</tspan></text><text text-anchor="middle"><tspan x="520" y="272">ΟΧΙ</tspan></text><rect class="yes" x="15" y="313" width="355" height="53" rx="8"/><rect class="no" x="410" y="313" width="355" height="53" rx="8"/><text text-anchor="middle"><tspan x="192.5" y="339">Σ · Διατήρηση δηλωμένου.</tspan></text><text text-anchor="middle"><tspan x="587.5" y="339">Συνέχεια στον επόμενο έλεγχο.</tspan></text></svg>