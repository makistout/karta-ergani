{% extends "ui/base.html" %}
{% set page_title = 'erganiOS - Ωρομέτρηση' %}
{% set shell = "office" %}
{% set active_nav = 'apologistic' %}

{% block content %}
  <div class="timekeeping-page-head">
    <div>
      <a class="timekeeping-back" id="timekeepingBack" href="/ui/apologistic"><i class="bi bi-arrow-left"></i> Απολογιστικό</a>
      <h1 class="page-title"><i class="bi bi-stopwatch" aria-hidden="true"></i> Ωρομέτρηση</h1>
      <p class="page-desc" id="timekeepingMeta">Φόρτωση αποτελεσμάτων…</p>
    </div>
    <button type="button" class="btn btn-primary" id="timekeepingExport">
      <i class="bi bi-file-earmark-excel" aria-hidden="true"></i> Λήψη Excel
    </button>
  </div>

  <div id="timekeepingSummary" class="apologistic-summary"></div>
  <div class="card list-card">
    <div id="timekeepingWrap" class="list-wrap"><p style="color:var(--muted);"><i class="bi bi-hourglass-split"></i> Υπολογισμός…</p></div>
  </div>
  <div class="msg hidden" id="timekeepingMsg" role="status"></div>
{% endblock %}

{% block scripts %}
  <script src="/static/js/apologistic-timekeeping.js?v=20260819a"></script>
{% endblock %}
