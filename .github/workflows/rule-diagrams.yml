name: Rule diagrams
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed rule documentation matches source
        run: python scripts/build_rule_diagrams.py --check
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check private access and calculation regressions
        run: python -m pytest -q tests/test_rule_diagrams.py tests/test_access_control.py tests/test_apologistic.py tests/test_apologistic_new_rules.py tests/test_timekeeping.py
